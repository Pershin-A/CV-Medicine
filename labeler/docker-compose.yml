services:
  dxa-labeler:
    build: .
    container_name: dxa_dicom_labeler

    ports:
      - "8501:8501"

    environment:
      DATA_ROOT: /data
      OUTPUT_ROOT: /output
      REFERENCE_XLSX: /reference/разметка.xlsx
      EXPECTED_DICOM_COUNT: ${EXPECTED_DICOM_COUNT:-499}
      EXPECTED_DATASET_FINGERPRINT: ${EXPECTED_DATASET_FINGERPRINT:-}
      STRICT_DATASET_CHECK: ${STRICT_DATASET_CHECK:-1}

    volumes:
      # ВАЖНО: source берётся из .env.
      # По умолчанию используются папки внутри dxa_labeler:
      # ./Исследования и ./Размеченные
      - type: bind
        source: ${DXA_DATA_DIR:-../Исследования}
        target: /data
        read_only: true

      - type: bind
        source: ${DXA_OUTPUT_DIR:-../Размеченные}
        target: /output

      - type: bind
        source: ${DXA_REFERENCE_XLSX:-../разметка.xlsx}
        target: /reference/разметка.xlsx
        read_only: true

    restart: unless-stopped
